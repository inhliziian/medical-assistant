# Named run configurations. A config = provider + the knobs that differ between runs.
# Prices are USD per million tokens from the provider's public list price (2026-10); Ollama is free per call.

[providers.haiku]
type = "anthropic"
model = "claude-haiku-5-5"
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50
timeout_s = 60
max_retries = 2

[providers.qwen]
type = "ollama"
model = "qwen3:4b"
base_url = "http://localhost:11434"
timeout_s = 240
max_retries = 1

# Hosted side: Haiku 5.5 rejects non-default temperature/top_p, so the sampling dimension is `effort`.
[configs.haiku_low]
provider = "haiku"
effort = "low"

[configs.haiku_high]
provider = "haiku"
effort = "high"

# Local side: classic sampling knobs.
[configs.qwen_t0]
provider = "qwen"
temperature = 0.0
top_p = 1.0
seed = 42
think = false

[configs.qwen_t07]
provider = "qwen"
temperature = 0.7
top_p = 0.9
seed = 42
think = false
