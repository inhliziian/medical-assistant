[project]
name = "medical-assistant"
version = "0.1.0"
description = "Course project: dirty medical reports -> schema-valid JSON, model and prompt comparison"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.80",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medassist"]
